# Test and Build API (path-filtered; runs on api/packages/tests changes)
name: Test and Build API

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

jobs:
  test:
    name: Test and Build API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-api-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-api-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd packages/database && npx prisma generate --schema=./prisma/schema.prisma

      - name: Type check
        run: npm run type-check

      - name: Lint API
        run: npm run lint --workspace=@project-bridge/api

      - name: Test API (unit)
        run: npm run test:api
        env:
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Run migrations (test DB)
        run: cd packages/database && npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Test API (integration – core truth)
        run: npm run test:integration:core
        env:
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Build API
        run: npm run build:api

      - name: Build and verify Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f apps/api/Dockerfile -t project-bridge-api:test .
          docker run --rm -d -p 3000:3000 --name api-test project-bridge-api:test
          sleep 10
          curl -f http://localhost:3000/api/v1/health || exit 1
          docker stop api-test
