# API Integration Tests & Docker Build (runs only on API-related changes)
# Note: Lint, unit tests, and basic builds are handled by ci.yml
name: API Integration & Docker

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "tests/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "tests/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"

jobs:
  integration-test:
    name: Integration Tests & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=@project-bridge/database

      - name: Build database package
        run: npm run build --workspace=@project-bridge/database

      - name: Run migrations (test DB)
        run: npm run deploy --workspace=@project-bridge/database

      - name: Integration tests
        run: npm run test:integration:core
        env:
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Build and verify Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f Dockerfile -t project-bridge-api:test .
          docker run --rm -d -p 3000:3000 --name api-test project-bridge-api:test
          sleep 10
          curl -f http://localhost:3000/api/v1/health || exit 1
          docker stop api-test
