# CI: build and test (solo dev – manual-only focus)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Generate (Prisma)
        run: cd packages/database && npx prisma generate --schema=./prisma/schema.prisma

      - name: Build API
        run: npm run build:api

      - name: Build frontend (apps/web)
        run: npx turbo run build --filter=ledger-system-frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

      - name: Lint API
        run: npm run lint --workspace=@project-bridge/api

      - name: Lint frontend (apps/web)
        run: npm run lint --workspace=ledger-system-frontend

      - name: Type check
        run: npm run type-check
        continue-on-error: true

      - name: Unit tests (API)
        run: npm test --workspace=@project-bridge/api
        continue-on-error: true
