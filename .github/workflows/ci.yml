# CI: build and test (Turborepo best practices)
# See: https://turbo.build/repo/docs/guides/ci-vendors/github-actions
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test_db
      # Optional: Turbo Remote Caching (set TURBO_TOKEN + TURBO_TEAM in repo)
      # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=@project-bridge/database

      - name: Build database package
        run: npm run build --workspace=@project-bridge/database

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests (API)
        run: npm run test:api
        env:
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Build API
        run: npm run build:api

      - name: Build frontend
        run: npx turbo run build --filter=ledger-system-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}
