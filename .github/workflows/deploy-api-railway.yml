# Deploy API to Railway (Docker build on Railway side)
name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "railway.json"
      - "apps/api/Dockerfile"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          if [ -n "${{ vars.RAILWAY_SERVICE_NAME }}" ]; then
            if ! railway up --service=${{ vars.RAILWAY_SERVICE_NAME }}; then
              echo "::error::Service '${{ vars.RAILWAY_SERVICE_NAME }}' not found in Railway. Either create a service with that name in your Railway project, or remove the RAILWAY_SERVICE_NAME repo variable (Settings → Secrets and variables → Actions) to use the default service."
              exit 1
            fi
          else
            railway up
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          sleep 30
          railway status
          timeout 300 bash -c 'until curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health; do sleep 10; done'

      - name: Smoke test production
        run: |
          curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health
          curl -sf -X POST "${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/transactions/quick-capture" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: test-tenant" \
            -d '{"totalAmount": 2500, "businessPurpose": "SALES", "customerSegment": "WALK_IN"}' || true

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 API deployed: ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health"
          else
            echo "❌ Deploy failed – check Railway logs"
          fi
