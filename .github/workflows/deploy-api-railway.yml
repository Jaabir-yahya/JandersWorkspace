# Deploy API to Railway (Docker build on Railway side)
name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "railway.json"
      - "apps/api/Dockerfile"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Debug - List Railway Services
        run: |
          echo "=== Railway Project Info ==="
          echo "Project ID: ${{ vars.RAILWAY_PROJECT_ID }}"
          echo "Configured Service Name: ${{ vars.RAILWAY_SERVICE_NAME }}"
          echo ""
          echo "=== Available Services ==="
          railway service list --json 2>/dev/null || echo "Could not list services"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: |
          SERVICE_NAME="${{ vars.RAILWAY_SERVICE_NAME }}"

          if [ -n "$SERVICE_NAME" ]; then
            echo "Deploying to service: $SERVICE_NAME"
            railway up --service="$SERVICE_NAME" --ci
          else
            echo "No RAILWAY_SERVICE_NAME set, deploying to default service"
            railway up --ci
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          sleep 30
          railway status
          timeout 300 bash -c 'until curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health; do sleep 10; done'

      - name: Smoke test production
        run: |
          curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health
          curl -sf -X POST "${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/transactions/quick-capture" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: test-tenant" \
            -d '{"totalAmount": 2500, "businessPurpose": "SALES", "customerSegment": "WALK_IN"}' || true

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 API deployed: ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health"
          else
            echo "❌ Deploy failed – check Railway logs"
          fi
