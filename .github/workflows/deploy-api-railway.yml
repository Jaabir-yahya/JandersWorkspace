# Deploy API to Railway (Docker build on Railway side)
name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "railway.json"
      - "apps/api/Dockerfile"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          # Get list of services
          SERVICES=$(railway service list --json 2>/dev/null || echo "[]")
          SERVICE_COUNT=$(echo "$SERVICES" | jq 'length' 2>/dev/null || echo "0")

          if [ "$SERVICE_COUNT" -eq "0" ]; then
            echo "::error::No services found in Railway project. Please create a service first."
            exit 1
          elif [ "$SERVICE_COUNT" -eq "1" ]; then
            # If only one service, use it
            SERVICE_NAME=$(echo "$SERVICES" | jq -r '.[0].name')
            echo "Found single service: $SERVICE_NAME"
            railway up --service="$SERVICE_NAME"
          elif [ -n "${{ vars.RAILWAY_SERVICE_NAME }}" ]; then
            # Use specified service name
            if ! railway up --service=${{ vars.RAILWAY_SERVICE_NAME }}; then
              echo "::error::Service '${{ vars.RAILWAY_SERVICE_NAME }}' not found in Railway."
              echo "Available services:"
              railway service list
              echo ""
              echo "Please set RAILWAY_SERVICE_NAME to one of the above service names at:"
              echo "Settings → Secrets and variables → Actions → Variables"
              exit 1
            fi
          else
            echo "::error::Multiple services found in Railway project. Please specify RAILWAY_SERVICE_NAME."
            echo "Available services:"
            railway service list
            echo ""
            echo "Set the RAILWAY_SERVICE_NAME variable at:"
            echo "Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          sleep 30
          railway status
          timeout 300 bash -c 'until curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health; do sleep 10; done'

      - name: Smoke test production
        run: |
          curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health
          curl -sf -X POST "${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/transactions/quick-capture" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: test-tenant" \
            -d '{"totalAmount": 2500, "businessPurpose": "SALES", "customerSegment": "WALK_IN"}' || true

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 API deployed: ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health"
          else
            echo "❌ Deploy failed – check Railway logs"
          fi
