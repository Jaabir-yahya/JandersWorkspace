# Deploy API to Railway (Docker build on Railway side)
name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "railway.json"
      - "apps/api/Dockerfile"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Debug Railway Info
        run: |
          echo "=== Railway Debug Info ==="
          echo "Project ID: ${{ vars.RAILWAY_PROJECT_ID }}"
          echo "Service Name: ${{ vars.RAILWAY_SERVICE_NAME }}"
          echo ""
          echo "=== Listing Projects ==="
          railway project list --json || true
          echo ""
          echo "=== Attempting to list services ==="
          railway service list --project="${{ vars.RAILWAY_PROJECT_ID || 'abundant-clarity' }}" --json || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: |
          if [ -z "${{ vars.RAILWAY_SERVICE_NAME }}" ]; then
            echo "::error::RAILWAY_SERVICE_NAME is not set!"
            echo "Please set it at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

          echo "Deploying to project: ${{ vars.RAILWAY_PROJECT_ID || 'abundant-clarity' }}"
          echo "Deploying to service: ${{ vars.RAILWAY_SERVICE_NAME }}"

          railway up \
            --project="${{ vars.RAILWAY_PROJECT_ID || 'abundant-clarity' }}" \
            --service="${{ vars.RAILWAY_SERVICE_NAME }}" \
            --environment="${{ vars.RAILWAY_ENVIRONMENT || 'production' }}" \
            --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          sleep 30
          echo "Checking deployment status..."
          timeout 300 bash -c 'until curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health; do sleep 10; done'

      - name: Smoke test production
        run: |
          curl -sf ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health
          curl -sf -X POST "${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/transactions/quick-capture" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: test-tenant" \
            -d '{"totalAmount": 2500, "businessPurpose": "SALES", "customerSegment": "WALK_IN"}' || true

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 API deployed: ${{ vars.RAILWAY_PUBLIC_URL }}/api/v1/health"
          else
            echo "❌ Deploy failed – check Railway logs"
          fi
